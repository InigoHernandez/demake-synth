# SPDX-License-Identifier: GPL-3.0-only
# Publishes web/ (the site and the emulator, the firmware core as dmk.wasm) to GitHub Pages on every push to main.
# web/dmk.wasm is built locally with `sh web/build.sh` and committed with the sources it comes from.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
